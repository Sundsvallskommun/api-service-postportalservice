spring:
  # The application must never declare topology in a real environment - its AMQP user has an empty configure
  # permission, and dynamic is false in application.yml for exactly that reason. Here the test configuration stands in
  # for the messaging-topology-operator and declares the queues the container starts against, so RabbitAdmin has to be
  # allowed to run. The declarations live in test scope only, which is what keeps the test a check of the real
  # contract rather than of a topology the service invented for itself.
  rabbitmq:
    dynamic: true
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
  cache:
    type: none
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6:///
  security:
    oauth2:
      client:
        provider:
          citizen:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          digitalregisteredletter:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          messagingsettings:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          messaging:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          party:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          legalentity:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          esigning:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          object-store:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
        registration:
          citizen:
            client-id: the-client-id
            client-secret: the-client-secret
          digitalregisteredletter:
            client-id: the-client-id
            client-secret: the-client-secret
          messagingsettings:
            client-id: the-client-id
            client-secret: the-client-secret
          messaging:
            client-id: the-client-id
            client-secret: the-client-secret
          object-store:
            client-id: the-client-id
            client-secret: the-client-secret
          party:
            client-id: the-client-id
            client-secret: the-client-secret
          legalentity:
            client-id: the-client-id
            client-secret: the-client-secret
          esigning:
            client-id: the-client-id
            client-secret: the-client-secret
integration:
  object-store:
    url: http://localhost:${wiremock.server.port:}/object-store
    bucket: messaging-attachments
    connect-timeout: 10
    read-timeout: 20
  citizen:
    url: http://localhost:${wiremock.server.port:}/api-citizen
  digitalregisteredletter:
    url: http://localhost:${wiremock.server.port:}/api-digitalregisteredletter
  esigning:
    url: http://localhost:${wiremock.server.port:}/api-esigning
  messagingsettings:
    url: http://localhost:${wiremock.server.port:}/api-messagingsettings
  messaging:
    url: http://localhost:${wiremock.server.port:}/api-messaging
  party:
    url: http://localhost:${wiremock.server.port:}/api-party
  legalentity:
    url: http://localhost:${wiremock.server.port:}/api-legalentity
