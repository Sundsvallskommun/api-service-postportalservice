spring:
  main:
    banner-mode: off
  application:
    name: api-service-postportalservice
  flyway:
    enabled: false
  cache:
    cache-names: portalPersonDataCache
    caffeine:
      spec: maximumSize=500, expireAfterWrite=600s
  jpa:
    hibernate:
      ddl-auto: none
  rabbitmq:
    # Correlated confirms plus returns are what let a publish be reported as failed instead of silently dropped.
    # Connection settings are supplied per environment - see the rabbitmq block further down.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      client:
        registration:
          citizen:
            authorization-grant-type: client_credentials
            provider: citizen
          digitalregisteredletter:
            authorization-grant-type: client_credentials
            provider: digitalregisteredletter
          messagingsettings:
            authorization-grant-type: client_credentials
            provider: messagingsettings
          messaging:
            authorization-grant-type: client_credentials
            provider: messaging
          party:
            authorization-grant-type: client_credentials
            provider: party
          legalentity:
            authorization-grant-type: client_credentials
            provider: legalentity
          esigning:
            authorization-grant-type: client_credentials
            provider: esigning
openapi:
  title: Postportalservice
  name: postportalservice
  version: '@project.version@'
logging:
  config: classpath:/custom-logback.xml
resilience4j:
  circuitbreaker:
    instances:
      messagingsettings:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      messaging:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      legalentity:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      messageRepository: {}
      attachmentRepository: {}
      departmentRepository: {}
      recipientRepository: {}
      userRepository: {}
      statisticsRepository: {}
      signingRepository: {}
# SMS delivery over RabbitMQ towards the messaging service.
#
# Connection settings (spring.rabbitmq.host/port/virtual-host/username/password) are supplied per environment and are
# deliberately not committed here. Only the names of the topology objects live here, since those are the contract with
# messaging - they are owned and declared by the messaging-topology-operator via GitOps, and the AMQP user has an empty
# configure permission, so this service must never declare a queue, exchange or binding.
#
# While disabled, SMS keeps going over the messaging REST API and no AMQP connection is opened at all.
rabbitmq:
  enabled: false
  # Outbound: messaging owns the inbound hub and the outcome hub; this service owns only the status queue it consumes.
  exchange: api-fabriken.messaging
  routing-key: sms
  # Inbound: bound to api-fabriken.messaging.status on 'sms.*', so it carries both sms.sent and sms.failed. Exactly one
  # terminal outcome arrives per send request, which is why nothing here polls or times out.
  status-queue: api-fabriken.postportal.sms-status
  publish-confirm-timeout-seconds: 5
# Do not let the broker's reachability gate service health.
management:
  health:
    rabbit:
      enabled: false
delivery:
  executor:
    # Concurrency limit towards the messaging service (the blocking call runs on the pool thread).
    # The work queue is intentionally unbounded - a recipient is never dropped; sustained overload may OOM.
    pool-size: 8
    await-termination-seconds: 30
integration:
  party:
    chunk:
      maxLegalIdsPerCall: 1000
      maxPartyIdsPerCall: 1000
